<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Interactivo de Malware</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Catálogo Interactivo de Malware</h1>
        <p>ITVO - Seguridad en Aplicaciones Web</p>
    </header>


    <main id="catalogo-grid" class="grid-container"></main>

   
<!-- Ventana Modal para mostrar los detalles multimedia -->
    <div id="modal" class="modal oculto">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <h2 id="modal-title">Nombre del Malware</h2>
            <p class="tipo-badge" id="modal-type">Tipo</p>
            
            <div class="multimedia-container">
                <img id="modal-img" src="" alt="Imagen del malware">
                
                <!-- Información estructurada del malware -->
                <div class="modal-info-grid">
                    <p><strong>Año de origen:</strong> <span id="modal-anio"></span></p>
                    <p><strong>Vía de propagación:</strong> <span id="modal-propagacion"></span></p>
                    <p><strong>Objetivo principal:</strong> <span id="modal-objetivo"></span></p>
                </div>
                
                <div class="modal-info-text">
                    <h4>Mecanismo de Funcionamiento</h4>
                    <p id="modal-funcionamiento"></p>
                    
                    <h4>Consecuencias</h4>
                    <p id="modal-consecuencias"></p>
                    
                    <h4>Medidas de Prevención</h4>
                    <p id="modal-prevencion"></p>
                </div>
                
                <!-- Contenedor para las características clave (Tags) -->
                <div id="modal-tags" class="tags-container"></div>
                
                <div class="video-section">
                    <h3>Documental / Demostración</h3>
                    <div class="iframe-container">
                        <iframe id="modal-video" src="" frameborder="0" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
